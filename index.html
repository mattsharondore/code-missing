<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Code Missing: The NI Hospice Missing Person Policy Game</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Brand palette: swap these for official NI Hospice brand colours if needed */
:root{
  --brand:#522452;      /* NI Hospice plum (logo wordmark) */
  --brand-2:#7f73b4;    /* NI Hospice lavender (logo petals) */
  --pink:#da7482;       /* NI Hospice heart pink */
  --accent:#f2a33a;     /* warm amber for highlights */
  --leaf:#3f9b6b;       /* green */
  --ink:#2a2338;--muted:#6f6880;--paper:#f7f2ea;--card:#ffffff;--line:#e8e0d4;
  --good:#2f8a5b;--goodbg:#e5f4ec;--bad:#c0392b;--badbg:#fbe9e7;--amber:#c27c12;--amberbg:#fff3dc;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#e9e5f6 0,transparent 60%),radial-gradient(900px 500px at 110% 10%,#fbe3e7 0,transparent 55%),var(--paper);color:var(--ink);line-height:1.45;min-height:100vh}
.wrap{max-width:1240px;margin:0 auto;padding:14px 16px 30px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.brandmark{display:flex;align-items:center;gap:12px}
.logo-slot{height:58px;display:flex;align-items:center}
.logo-slot img{height:58px;width:auto}
.wordmark{line-height:1.05}
.wordmark .org{font-family:'Baloo 2',Nunito,sans-serif;font-weight:800;font-size:20px;color:var(--brand);letter-spacing:.2px}
.wordmark .tag{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px}
.game-title{font-family:'Baloo 2';font-weight:800;color:var(--pink);font-size:20px;margin-left:6px;padding-left:12px;border-left:2px solid var(--line)}
.hud{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:700;display:flex;gap:6px;align-items:center;box-shadow:0 2px 0 rgba(42,35,56,.05)}
.pill b{font-variant-numeric:tabular-nums}
.pill.clock{background:var(--brand);color:#fff;border-color:var(--brand)}
.pill.btnq{cursor:pointer;font:inherit;font-weight:700;color:var(--muted)}
.pill svg{width:16px;height:16px}
.game{display:grid;grid-template-columns:1fr 290px;gap:14px}
@media(max-width:960px){.game{grid-template-columns:1fr}}
.stage{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(60,30,80,.18),0 0 0 4px #fff;background:#3a3450}
canvas.map{display:block;width:100%;height:auto}
.prompt{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(42,35,56,.92);color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;display:none;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.prompt.show{display:block;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-3px)}}
.side{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 3px 0 rgba(42,35,56,.04)}
.panel h3{margin:0 0 10px;font-family:'Baloo 2';font-size:18px;color:var(--brand);display:flex;align-items:center;gap:8px}
.check{list-style:none;margin:0;padding:0;font-size:14.5px}
.check li{display:flex;gap:10px;padding:7px 0;border-bottom:1.5px dashed var(--line);align-items:flex-start}
.check li:last-child{border:0}
.check .bx{width:22px;height:22px;border-radius:7px;border:2px solid #cfc6d8;flex:none;display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px;background:#fff}
.check li.done .bx{background:var(--good);border-color:var(--good);animation:popin .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{transform:scale(.3)}to{transform:none}}
.check li.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.2)}
.check small{display:block;color:var(--muted);font-size:12px;text-decoration:none}
.check li.done small{color:var(--good);font-weight:700}
.howto{font-size:13.5px;color:#4a4458}
.howto .keys{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.key{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;background:#fff;border:1.5px solid #d6cddf;border-bottom-width:3px;border-radius:7px;font-weight:800;font-size:12px;color:var(--brand)}
.controls{display:none;justify-content:space-between;align-items:center;margin-top:12px;padding:0 6px}
@media(hover:none),(max-width:960px){.controls{display:flex}}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:5px}
.dpad button,.act{font:inherit;border:0;color:#fff;touch-action:none;user-select:none;cursor:pointer}
.dpad button{border-radius:14px;background:var(--brand);font-size:22px;box-shadow:0 4px 0 #361636}
.dpad button:active{transform:translateY(3px);box-shadow:0 1px 0 #361636}
.act{width:104px;height:104px;border-radius:50%;background:var(--accent);font-size:17px;font-weight:900;box-shadow:0 5px 0 #b86f12}
.act:active{transform:translateY(3px);box-shadow:0 2px 0 #b86f12}
/* ===== mobile full-screen play ===== */
body.mplay{overflow:hidden;position:fixed;inset:0;width:100%}
body.mplay header.top,body.mplay .foot{display:none}
body.mplay .wrap{padding:0;max-width:none}
.mgame{position:fixed;inset:0;height:100vh;height:100dvh;background:#241c31;z-index:5;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.mgame canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.mtop{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;display:flex;gap:6px;justify-content:space-between;align-items:center;pointer-events:none}
.mtop .grp{display:flex;gap:6px;pointer-events:auto}
.mtop .pill{padding:5px 10px;font-size:13.5px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.mtop button.pill{font:inherit;font-size:13.5px;font-weight:800;cursor:pointer;color:var(--brand)}
.mctl{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px;pointer-events:none}
.mctl>*{pointer-events:auto}
.mctl .dpad{grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:5px}
.mctl .dpad button{background:rgba(82,36,82,.78);box-shadow:0 4px 0 rgba(40,15,40,.7);backdrop-filter:blur(2px)}
.mctl .act{width:96px;height:96px;background:rgba(218,116,130,.92);box-shadow:0 5px 0 #a8495a;font-size:16px}
.mgame .prompt{bottom:calc(env(safe-area-inset-bottom) + 210px);font-size:13.5px;white-space:normal;max-width:86vw;text-align:center}
.drawer{position:absolute;inset:0;background:rgba(30,20,45,.45);display:none;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top) + 56px) 12px 12px;z-index:6}
.drawer.open{display:flex}
.drawer .panel{width:100%;max-width:440px;max-height:75vh;overflow:auto}
.drawer h3{justify-content:space-between}
.drawer h3 button{font:inherit;border:0;background:var(--brand);color:#fff;border-radius:10px;padding:4px 10px;font-weight:800;cursor:pointer}
@media (orientation:landscape){.mctl .dpad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px)}.mctl .act{width:84px;height:84px}.mgame .prompt{bottom:calc(env(safe-area-inset-bottom) + 18px)}}
.mhint{pointer-events:none !important;background:rgba(36,28,49,.78);color:#fff;font-weight:800;font-size:13px;padding:8px 12px;border-radius:12px;max-width:58vw;line-height:1.3;box-shadow:0 4px 12px rgba(0,0,0,.25);transition:opacity .6s}
.mhint.fade{opacity:0}
.joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:3px solid rgba(255,255,255,.7);background:rgba(82,36,82,.25);display:none;pointer-events:none;z-index:7;align-items:center;justify-content:center}
.joy.on{display:flex}
.joy .knob{width:48px;height:48px;border-radius:50%;background:rgba(218,116,130,.92);box-shadow:0 3px 10px rgba(0,0,0,.3)}
canvas.map{touch-action:none;cursor:pointer}
.polbtn{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff !important;text-decoration:none;font-weight:800;border-radius:12px;padding:9px 14px;box-shadow:0 3px 0 #361636;font-size:14.5px}
.polbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #361636}
.pend{display:inline-block;background:#b81c2b;color:#fff;font-weight:900;font-size:11px;letter-spacing:.6px;text-transform:uppercase;padding:3px 8px;border-radius:6px;vertical-align:middle}
.polbox{margin-top:16px;background:linear-gradient(135deg,#f5eef8,#fdf0f2);border:2px solid #e8d8ee;border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.polbox .txt{flex:1;min-width:200px;font-size:14.5px}
.polbox b.h{font-family:'Baloo 2';font-size:18px;color:var(--brand);display:block}
.mgame.ctrl-dpad .mhint{display:none}
.mgame.ctrl-touch .mctl .dpad{display:none}
.mgame.ctrl-dpad .mctl{align-items:flex-end}
.setlbl{font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:4px 0 8px}
.ctlopt{width:100%;font:inherit;display:flex;gap:12px;align-items:center;text-align:left;background:#fbf8f4;border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer;color:var(--ink)}
.ctlopt .ci{font-size:26px;flex:none}
.ctlopt b{display:block;font-family:'Baloo 2';font-size:17px;color:var(--brand);line-height:1.1}
.ctlopt small{display:block;color:var(--muted);font-size:13px}
.ctlopt .tickc{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2px solid #d6cddf;display:grid;place-items:center;color:transparent;font-weight:900;flex:none}
.ctlopt.sel{border-color:var(--pink);background:#fdf0f2}
.ctlopt.sel .tickc{background:var(--pink);border-color:var(--pink);color:#fff}
/* modal */
.modal{position:fixed;inset:0;background:rgba(30,20,45,.5);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.show{display:flex}
.dlg{background:var(--card);border-radius:22px;max-width:580px;width:100%;padding:0;box-shadow:0 24px 60px rgba(30,10,50,.35);animation:rise .25s cubic-bezier(.2,1.3,.5,1);max-height:92vh;overflow:auto;border:4px solid #fff}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.dlg-head{display:flex;gap:14px;align-items:center;padding:16px 18px 12px;background:linear-gradient(135deg,#f5ecf8,#fdf3e4);border-radius:18px 18px 0 0}
.portrait{width:72px;height:72px;border-radius:50%;background:#fff;border:3px solid #fff;box-shadow:0 3px 10px rgba(91,42,110,.25);flex:none;display:grid;place-items:center;overflow:hidden}
.portrait canvas,.portrait img{width:72px;height:72px}
.portrait svg{width:40px;height:40px}
.dlg .nm{font-family:'Baloo 2';font-weight:800;font-size:20px;color:var(--brand);line-height:1.1}
.dlg .rl{font-size:13px;color:var(--muted);font-weight:700}
.dlg-body{padding:6px 20px 20px}
.dlg-body p{margin:8px 0 4px;font-size:16px}
.opts{display:grid;gap:9px;margin-top:14px}
.opt{font:inherit;font-size:15px;text-align:left;background:#fbf8f4;border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;color:var(--ink);display:flex;gap:10px;align-items:flex-start;transition:transform .1s,border-color .15s,background .15s}
.opt:hover{border-color:var(--brand-2);background:#fff;transform:translateX(3px)}
.opt .k{flex:none;width:24px;height:24px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;margin-top:1px}
.fb{border-radius:16px;padding:14px 16px;margin:16px 18px 4px;font-size:15.5px}
.fb.good{background:var(--goodbg);border:2px solid #bfe3cf}
.fb.ok{background:var(--amberbg);border:2px solid #f3d9a4}
.fb.bad{background:var(--badbg);border:2px solid #f2c4bd}
.fb .verdict{font-family:'Baloo 2';font-weight:800;font-size:20px;display:block;margin-bottom:2px}
.fb.good .verdict{color:var(--good)}.fb.ok .verdict{color:var(--amber)}.fb.bad .verdict{color:var(--bad)}
.ref{display:inline-flex;gap:5px;align-items:center;margin-top:8px;font-size:12.5px;background:rgba(91,42,110,.1);color:var(--brand);padding:3px 10px;border-radius:999px;font-weight:800}
.btn{font:inherit;font-weight:800;font-size:16px;border:0;border-radius:14px;padding:12px 20px;cursor:pointer;background:var(--brand);color:#fff;box-shadow:0 4px 0 #361636;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #361636}
.btn.amber{background:var(--accent);box-shadow:0 4px 0 #b86f12}
.btn.ghost{background:#fff;color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset,0 4px 0 #d9cfe0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* title */
.hero{position:relative;border-radius:26px;overflow:hidden;box-shadow:0 14px 40px rgba(60,30,80,.22),0 0 0 5px #fff;background:#a5d08d}
.hero canvas{display:block;width:100%;height:auto;filter:saturate(1.05)}
.hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,18,56,.0) 25%,rgba(40,18,56,.82) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:28px;color:#fff}
.hero h1{font-family:'Baloo 2';font-weight:800;font-size:54px;line-height:1;margin:0;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.hero h1 span{color:#f3a5b0}
.hero p{font-size:18px;max-width:640px;margin:8px 0 0;font-weight:600}
.hero .badge{display:inline-block;background:var(--pink);color:#fff;font-weight:900;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;border-radius:999px;margin-bottom:10px;align-self:flex-start}
@media(max-width:640px){.hero h1{font-size:36px}.hero p{font-size:15px}.hero .ov{padding:18px}}
.pick{margin-top:22px}
.pick h2,h2.sec{font-family:'Baloo 2';color:var(--brand);font-size:24px;margin:0 0 10px}
h2.sec{margin-top:22px}
.heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.hero-card{position:relative;font:inherit;text-align:center;border:0;border-radius:20px;padding:16px 14px 18px;cursor:pointer;background:var(--card);box-shadow:0 0 0 2px var(--line),0 6px 0 #e4dacd;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .12s,box-shadow .12s}
.hero-card:hover{transform:translateY(-3px)}
.hero-card.sel{box-shadow:0 0 0 3px var(--pink),0 6px 0 #c95d6c;background:linear-gradient(180deg,#fff,#fdf0f2)}
.hero-card img{width:110px;height:110px;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 14px rgba(82,36,82,.25);margin-bottom:6px}
.hero-card b{font-family:'Baloo 2';font-size:19px;color:var(--brand);line-height:1.1}
.hero-card .ht{font-size:13.5px;font-weight:800;color:var(--pink)}
.hero-card .hs{font-size:12.5px;color:var(--muted)}
.hero-card .hn{position:absolute;left:12px;top:10px;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px}
.hero-card .chosen{margin-top:6px;background:var(--pink);color:#fff;border-radius:999px;padding:3px 12px;font-weight:900;font-size:12.5px}
.shifts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:0}
.shift{font:inherit;text-align:left;border:0;border-radius:20px;padding:0;cursor:pointer;background:var(--card);box-shadow:0 0 0 2px var(--line),0 6px 0 #e4dacd;overflow:hidden;transition:transform .12s;color:var(--ink)}
.shift:hover{transform:translateY(-3px)}
.shift .art{height:110px;position:relative;overflow:hidden}
.shift .art canvas{width:100%;height:100%;display:block}
.shift .num{position:absolute;left:12px;top:10px;background:#fff;color:var(--brand);font-family:'Baloo 2';font-weight:800;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.shift .stars{position:absolute;right:12px;top:12px;color:#ffd166;font-size:18px;text-shadow:0 1px 3px rgba(0,0,0,.4);letter-spacing:2px}
.shift .info{padding:14px 16px 16px}
.shift h3{margin:0;font-family:'Baloo 2';font-size:21px;color:var(--brand)}
.shift .meta{font-size:13.5px;color:var(--muted);font-weight:600}
.shift .go{display:inline-block;margin-top:10px;background:var(--brand);color:#fff;border-radius:10px;padding:6px 12px;font-weight:800;font-size:14px}
.credit{display:flex;gap:16px;align-items:center;margin-top:18px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 18px;font-size:14.5px;color:#4a4458}
.credit img{height:56px;width:auto;flex:none}
.credit .polbtn{margin-left:auto;flex:none}
@media(max-width:560px){.credit{flex-direction:column;align-items:flex-start}}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:18px}
.how div{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;font-size:14.5px}
.how b{font-family:'Baloo 2';font-size:17px;color:var(--brand);display:block}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-10px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-size:15px;font-weight:700;opacity:0;transition:all .3s;pointer-events:none;z-index:20;max-width:92vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.warn{background:var(--bad)}
.toast.good{background:var(--good)}
.foot{font-size:12.5px;color:var(--muted);margin-top:18px;text-align:center}
/* results */
.result{max-width:760px;margin:0 auto;background:var(--card);border-radius:26px;overflow:hidden;box-shadow:0 14px 40px rgba(60,30,80,.18),0 0 0 5px #fff}
.result .top{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;text-align:center;padding:26px 20px 22px}
.result .top .eyebrow{font-weight:800;letter-spacing:1.2px;text-transform:uppercase;font-size:12px;opacity:.85}
.result .stars-big{font-size:46px;color:#ffd166;letter-spacing:6px;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.result .big{font-family:'Baloo 2';font-weight:800;font-size:64px;line-height:1}
.result .big small{font-size:24px;opacity:.75}
.result .body{padding:20px 24px 24px}
.tl{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
.tl td{padding:8px 6px;border-bottom:1.5px dashed var(--line)}
.tl td.tm{text-align:right;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.learn{margin-top:16px;background:#faf6fb;border-radius:16px;padding:14px 18px}
.learn h4{margin:0 0 6px;font-family:'Baloo 2';color:var(--brand);font-size:18px}
.learn li{margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brandmark">
      <div class="logo-slot" id="logoSlot"></div>
      <div class="wordmark"><div class="tag">Adult Services</div><div class="tag">Staff training</div></div>
      <div class="game-title">Code Missing</div>
    </div>
    <div class="hud" id="hud" style="display:none">
      <div class="pill clock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><b id="clk">00:00</b></div>
      <div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10 2h4M12 14l3-3"/><circle cx="12" cy="14" r="8"/></svg><b id="elapsed">0</b> min</div>
      <div class="pill"><svg viewBox="0 0 24 24" fill="#f2a33a"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21l1.5-7L2 9.3l7-.8z"/></svg><b id="score">0</b></div>
      <button class="pill btnq" id="mute" title="Music on/off">🔊 Music</button><button class="pill btnq" id="quit">Quit</button>
    </div>
  </header>
  <main id="app"></main>

const OL='#2e2639';
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function fillStroke(c,fill,lw=1.6,stroke=OL){c.fillStyle=fill;c.fill();if(lw){c.lineWidth=lw;c.strokeStyle=stroke;c.stroke();}}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2);}
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);}
function shade(hex,amt){let n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function rnd(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647;}
function addMins(t,m){let [h,mi]=t.split(':').map(Number);let x=((h*60+mi+Math.floor(m))%1440+1440)%1440;return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}
function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className='toast show '+(kind||'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2600)}

function drawChar(c,x,y,cfg,o={}){
  const dir=o.dir||'d',ph=o.phase||0,mv=o.moving,sc=o.scale||1;
  c.save();c.translate(x,y);c.scale(sc,sc);
  const sw=mv?Math.sin(ph):0, bob=mv?Math.abs(Math.cos(ph))*1.6:0;
  // shadow
  c.fillStyle='rgba(30,20,40,.22)';ell(c,0,-1,11,4);c.fill();
  c.translate(0,-bob);
  // legs
  const lc=cfg.legs||shade(cfg.top,-30);
  if(!o.sitting){
    rr(c,-6.5,-11+sw*2,5.5,10,2.5);fillStroke(c,lc,1.4);
    rr(c,1,-11-sw*2,5.5,10,2.5);fillStroke(c,lc,1.4);
    c.fillStyle=cfg.old?'#8a6f5c':'#3a3346';rr(c,-7,-3+sw*2,6.5,3.5,1.5);c.fill();rr(c,0.5,-3-sw*2,6.5,3.5,1.5);c.fill();
  }
  // arms (behind for up)
  const armY=-21, as=mv?sw*3:0;
  const arm=(side)=>{rr(c,side*11-3.2,armY+(side>0?-as:as),6.4,12,3.2);fillStroke(c,cfg.acc.includes('cardigan')?'#9b9aa3':cfg.top,1.4);circ(c,side*11,armY+11+(side>0?-as:as),2.8);fillStroke(c,cfg.skin,1.2);};
  arm(-1);arm(1);
  // body
  rr(c,-10,-26,20,17,7);fillStroke(c,cfg.top,1.7);
  if(cfg.acc.includes('jacket')&&dir!=='u'){c.beginPath();c.moveTo(-5,-26);c.lineTo(5,-26);c.lineTo(0,-13);c.closePath();fillStroke(c,'#ffffff',1.2);
    c.beginPath();c.moveTo(-1.4,-23);c.lineTo(1.4,-23);c.lineTo(1.8,-15);c.lineTo(0,-13.5);c.lineTo(-1.8,-15);c.closePath();fillStroke(c,'#8e2f3c',.9);
    c.strokeStyle=shade(cfg.top,-25);c.lineWidth=1.3;c.beginPath();c.moveTo(-5,-26);c.lineTo(-2.5,-19);c.moveTo(5,-26);c.lineTo(2.5,-19);c.stroke();
    c.fillStyle='#ffffff';c.fillRect(-8.5,-21,3,1.3);c.fillStyle=shade(cfg.top,30);circ(c,0,-11.5,.9);c.fill();}
  if(cfg.acc.includes('dress')){c.beginPath();c.moveTo(-9,-13);c.lineTo(9,-13);c.lineTo(13,-3);c.quadraticCurveTo(0,0,-13,-3);c.closePath();fillStroke(c,cfg.top,1.6);
    c.save();c.beginPath();rr(c,-10,-26,20,17,7);c.moveTo(-9,-13);c.lineTo(9,-13);c.lineTo(13,-3);c.quadraticCurveTo(0,0,-13,-3);c.closePath();c.clip();c.fillStyle='#ffffff';
    for(let yy=-25;yy<0;yy+=4.2)for(let xx=-13+((yy|0)%2?2:0);xx<14;xx+=4.4){circ(c,xx,yy,1.05);c.fill();}c.restore();
    c.fillStyle=shade(cfg.top,-30);c.fillRect(-9.6,-14.5,19.2,2);}
  if(cfg.acc.includes('scrubs')&&dir!=='u'){c.fillStyle=shade(cfg.top,-18);rr(c,2.5,-17,5,4,1);c.fill();}
  if(cfg.acc.includes('stripes')){c.save();rr(c,-10,-26,20,17,7);c.clip();c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=1.6;for(let i=-10;i<12;i+=4){c.beginPath();c.moveTo(i,-26);c.lineTo(i,-9);c.stroke();}c.restore();rr(c,-10,-26,20,17,7);c.lineWidth=1.7;c.strokeStyle=OL;c.stroke();}
  if(cfg.acc.includes('cardigan')){c.fillStyle='#9b9aa3';rr(c,-10,-26,7,17,5);c.fill();rr(c,3,-26,7,17,5);c.fill();rr(c,-10,-26,20,17,7);c.lineWidth=1.7;c.strokeStyle=OL;c.stroke();c.fillStyle='#e8e6ee';circ(c,-3.5,-20,.9);c.fill();circ(c,-3.5,-15,.9);c.fill();}
  if(cfg.acc.includes('gown')){c.fillStyle=shade(cfg.top,-25);c.beginPath();c.moveTo(-2,-26);c.lineTo(2,-26);c.lineTo(5,-9);c.lineTo(-5,-9);c.closePath();c.fill();c.strokeStyle='#fff';c.lineWidth=1.5;c.beginPath();c.moveTo(-9,-15);c.lineTo(9,-15);c.stroke();}
  if(cfg.trim&&dir!=='u'){c.strokeStyle=cfg.trim;c.lineWidth=1.8;c.beginPath();c.moveTo(-5,-25.5);c.lineTo(0,-20);c.lineTo(5,-25.5);c.stroke();c.beginPath();c.moveTo(-9.3,-17);c.lineTo(-5,-17);c.stroke();}
  if(cfg.acc.includes('hivis')){c.fillStyle='#f6e84a';c.fillRect(-9.5,-18,19,3.2);c.fillStyle='#c9cbd2';c.fillRect(-9.5,-17,19,1);}
  if(cfg.acc.includes('lanyard')&&dir!=='u'){c.strokeStyle='#e04a7a';c.lineWidth=1.3;c.beginPath();c.moveTo(-4,-25);c.lineTo(0,-17);c.lineTo(4,-25);c.stroke();rr(c,-2.5,-17.5,5,6,1);fillStroke(c,'#fff',1);c.fillStyle='#522452';c.fillRect(-1.5,-16.5,3,1.5);}
  if(cfg.acc.includes('steth')&&dir!=='u'){c.strokeStyle='#4b4f5e';c.lineWidth=1.6;c.beginPath();c.moveTo(-6,-26);c.quadraticCurveTo(-8,-15,-2,-14);c.moveTo(6,-26);c.quadraticCurveTo(8,-18,4,-16);c.stroke();circ(c,4,-15,2.4);fillStroke(c,'#d9dde5',1.1);}

function drawWall(c,x,y){

  c.strokeStyle='rgba(60,30,80,.18)';c.lineWidth=1;c.strokeRect(X+.5,Y+.5,T-1,T-1);
}

function onTap(tx,ty){

  <div class="credit"><img alt="Northern Ireland Hospice" src="${LOGO_SRC}"><div><b>Based on the Northern Ireland Hospice <i>Missing Patient in Adult Services</i> policy</b><br>Lovingly updated by Dr Matthew Doré, 11 November 2026. No patients were actually misplaced in the making of this game.</div></div>
  <div class="polbox"><div class="txt"><b class="h">📄 Before you play: read the real thing</b>The full <i>Missing Patient in Adult Services</i> policy is the document you're actually expected to follow. The game just helps it stick. <span class="pend">Pending clinical leads' approval</span></div><a class="polbtn" href="${POLICY_URL}" target="_blank" rel="noopener">Open the policy PDF</a></div>
  <div class="how"><div><b>🚶 Walk</b>Arrow keys, WASD, or the on-screen pad on a phone or tablet</div><div><b>✋ Talk &amp; use</b>Press Space or E next to people, or next to the desk at the nurses' station</div><div><b>🔍 Search</b>Walk into a room to search it. Its label turns green.</div><div><b>⏱ Beat the clock</b>One game minute passes every 1.5 seconds. Every decision counts.</div></div>`;
  // hero art: full map with characters
  const h=heroCanvas('day');const c=h.c;
  [[HERO_ID,4,8,'r'],['ciara',6,8,'l'],['hughes',21,3,'d'],['dessie',8,12,'d'],['mark',17,11,'l'],['frank',15,12,'r'],['orla',22,12,'l'],['joe',29,12,'d']].forEach(([id,x,y,d])=>drawChar(c,x*T+T/2,y*T+T-3,CHARS[id],{dir:d,t:500,sitting:['hughes','joe'].includes(id)}));
  h.cvs.style.width='100%';$('#hero').prepend(h.cvs);
  const crops=[[22*T,6*T,10*T,5*T],[13*T,9*T,10*T,5*T],[0,6*T,10*T,5*T]];
  $('#shifts').innerHTML=SCEN.map((s,i)=>`<button class="shift" data-i="${i}"><div class="art" id="art${i}"><span class="num">${i+1}</span><span class="stars">${best[s.id]!=null?stars(best[s.id]):''}</span></div><div class="info"><h3>${s.title}</h3><div class="meta">${s.sub}</div><div style="font-size:14px;margin-top:6px">${s.blurb}</div><span class="go">Play ▶</span></div></button>`).join('');
  SCEN.forEach((s,i)=>{const a=heroCanvas(s.mode,crops[i]);const c2=a.c;
    if(i===0){drawChar(c2,29*T+16,12*T+27,CHARS.joe,{sitting:1,mood:'sad'});c2.setTransform(1,0,0,1,0,0);c2.fillStyle='rgba(12,14,40,.55)';c2.fillRect(0,0,a.cvs.width,a.cvs.height);}
    if(i===1){drawChar(c2,17*T+16,11*T+29,CHARS.mark,{dir:'l'});drawChar(c2,15*T+16,12*T+29,CHARS.frank,{dir:'r'});drawChar(c2,22*T+16,12*T+29,CHARS.orla,{dir:'l'});}
    if(i===2){drawChar(c2,6*T+16,8*T+29,CHARS.tom,{dir:'r'});drawChar(c2,3*T+16,8*T+29,CHARS[HERO_ID],{dir:'r'});c2.setTransform(1,0,0,1,0,0);c2.fillStyle='rgba(255,140,60,.18)';c2.fillRect(0,0,a.cvs.width,a.cvs.height);}
    a.cvs.style.cssText='width:100%;height:100%;object-fit:cover';$('#art'+i).prepend(a.cvs);});
  app.querySelectorAll('.shift').forEach(b=>b.onclick=()=>start(+b.dataset.i));
  renderHeroes();
}
function renderHeroes(){
  const el=$('#heroes');if(!el)return;
  el.innerHTML=HEROES.map((h,i)=>`<button class="hero-card${h.id===HERO_ID?' sel':''}" data-id="${h.id}"><span class="hn">${i+1}</span><img alt="" src="${portrait(h.id)}"><b>${h.name}</b><span class="ht">${h.tag}</span><span class="hs">⚡ ${h.skill}</span><span class="hs">📊 ${h.stat}</span>${h.id===HERO_ID?'<span class="chosen">✓ Selected</span>':''}</button>`).join('');
  el.querySelectorAll('.hero-card').forEach(b=>b.onclick=()=>{HERO_ID=b.dataset.id;try{localStorage.setItem('codeMissingHero',HERO_ID)}catch(e){}Music.stinger('good');
    // redraw hero art with new character
    home();setTimeout(()=>{const p=$('.pick');p&&p.scrollIntoView({behavior:'smooth',block:'center'})},30);});
}
$('#quit').onclick=home;

function endGame(){
  S.ended=true;S.running=false;closeDlg();cancelAnimationFrame(raf);document.body.classList.remove('mplay');Music.stop(.3);setTimeout(()=>Music.stinger('end'),350);
  const max=S.check.reduce((a,c)=>a+c.pts,0);const pct=S.score/max;const n=pct>=.85?3:pct>=.6?2:pct>=.3?1:0;
  const prev=best[S.sc.id];if(prev==null||n>prev){best[S.sc.id]=n;try{localStorage.setItem('codeMissingNIH',JSON.stringify(best))}catch(e){}}
  const msgs=['Time for a refresher. Have another go.','Getting there. Some steps were missed or came too late.','Solid shift. Almost everything by the book.','Outstanding. Calm, quick and right by the policy.'];
  const i=S.i;
  app.innerHTML=`<div class="result"><div class="top"><div class="eyebrow">Shift complete · ${S.sc.title} · played by ${HERO().name}</div><div class="stars-big">${stars(n)}</div><div class="big">${S.score}<small> / ${max}</small></div><div style="font-size:17px;font-weight:700;margin-top:6px">${msgs[n]}</div><div style="opacity:.85;margin-top:4px">${S.sc.start} → ${addMins(S.sc.start,S.mins)} · ${S.searched.size} areas searched</div></div>
   <div class="body"><table class="tl">${S.check.map(c=>`<tr><td style="width:28px">${c.done?'✅':'⬜'}</td><td>${c.label}</td><td class="tm">${c.done?addMins(S.sc.start,c.at):'missed'}</td></tr>`).join('')}</table>
   ${S.log.length?`<div class="learn"><h4>💡 Learning points</h4><ul>${S.log.map(m=>`<li>${m.f} <span class="ref">📘 ${m.ref}</span></li>`).join('')}</ul></div>`:''}
   <div class="polbox"><div class="txt"><b class="h">📄 Reminder: the policy is the real rulebook</b>The game is for practice. In a real situation, follow the <i>Missing Patient in Adult Services</i> policy. Have a read of the full document. <span class="pend">Pending clinical leads' approval</span></div><a class="polbtn" href="${POLICY_URL}" target="_blank" rel="noopener">Open the policy PDF</a></div>
   <div style="text-align:center;color:var(--muted);font-size:13px;margin-top:14px">Scored against the NI Hospice Missing Person policy, updated by Dr Matthew Doré on 11 November 2026.</div>
   <div class="row" style="justify-content:center;margin-top:14px"><button class="btn ghost" id="again">↻ Replay</button>${i<SCEN.length-1?`<button class="btn amber" id="nextS">Next shift →</button>`:''}<button class="btn" id="menu">All shifts</button></div></div></div>`;
  $('#again').onclick=()=>start(i);if($('#nextS'))$('#nextS').onclick=()=>start(i+1);$('#menu').onclick=home;
  window.scrollTo({top:0,behavior:'smooth'});
}
document.fonts&&document.fonts.ready.then(()=>{if(!S)home();});
LOGO_IMG.onload=()=>{if(!S)home();};
home();
</script>
</body>
</html>
